name: Tests

# Runs backend tests and frontend type-check on every PR and push to main.
# Does not require any API keys — tests use ScriptedModel (no real LLM).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        # bubblewrap is needed for shell sandbox tests; git for workspace ops
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap git
          bwrap --version

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Set up Python
        run: uv python install 3.12

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Run ruff check
        working-directory: backend
        run: uv run ruff check src/ tests/

      - name: Run ruff format check
        working-directory: backend
        run: uv run ruff format --check src/ tests/

      - name: Run pytest
        working-directory: backend
        run: uv run pytest -v --tb=short

  frontend-check:
    name: Frontend build + lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build (includes tsc type-check)
        working-directory: frontend
        run: npm run build
