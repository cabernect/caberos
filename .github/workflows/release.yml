name: Release

# Builds the CaberOS desktop app (.dmg) with signed updater artifacts and
# attaches them to a GitHub release.
# Triggers when a tag matching v*.*.* is pushed.
#
# Usage:
#   git tag v0.1.3
#   git push origin v0.1.3
#
# The workflow will:
#   1. Verify version manifests agree with the tag
#   2. Build the PyInstaller gateway (macOS ARM64)
#   3. Build the Tauri app with updater artifacts (signed)
#   4. Create a DMG
#   5. Generate the updater manifest (latest.json)
#   6. Create a GitHub release with the DMG + updater artifacts attached
#
# Required secrets (set once in GitHub repo settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY — Ed25519 private key for signing updates
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — password for the private key (empty string if none)
#
# Platform: macOS ARM64 (Apple Silicon) only for now.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build macOS ARM64
    runs-on: macos-14  # Apple Silicon runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify version manifests agree with tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/check-version.sh
          BACKEND_VERSION=$(grep '^version = ' backend/pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if [ "$BACKEND_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Tag version ($TAG_VERSION) does not match manifest version ($BACKEND_VERSION)"
            echo "Run: ./scripts/set-version.sh $TAG_VERSION"
            exit 1
          fi
          echo "✅ Tag and manifests agree: $TAG_VERSION"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Set up Python
        run: uv python install 3.12

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Cache PyInstaller build
        uses: actions/cache@v4
        with:
          path: |
            backend/build/pyinstaller
            frontend/src-tauri/resources/gateway
          key: pyinstaller-${{ runner.os }}-${{ hashFiles('backend/uv.lock', 'scripts/build-gateway.sh') }}
          restore-keys: |
            pyinstaller-${{ runner.os }}-

      - name: Build PyInstaller gateway
        run: bash scripts/build-gateway.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontend/src-tauri/target
          key: rust-${{ runner.os }}-${{ hashFiles('frontend/src-tauri/Cargo.lock', 'frontend/src-tauri/src/**/*.rs', 'frontend/src-tauri/Cargo.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Build Tauri app with updater artifacts
        working-directory: frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run desktop:build

      - name: Build DMG
        run: bash scripts/build-dmg.sh

      - name: Generate updater manifest
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          UPDATER_TARGZ=$(find frontend/src-tauri/target/release/bundle -name "*.tar.gz" -path "*macos*" | head -1)
          UPDATER_SIG=$(find frontend/src-tauri/target/release/bundle -name "*.tar.gz.sig" -path "*macos*" | head -1)

          if [ -z "$UPDATER_TARGZ" ] || [ -z "$UPDATER_SIG" ]; then
            echo "⚠️ No updater artifacts found — publishing without auto-update metadata"
            exit 0
          fi

          SIGNATURE=$(cat "$UPDATER_SIG")
          REPO="cabernect/caberos"
          TARGZ_NAME=$(basename "$UPDATER_TARGZ")

          cat > latest.json << EOF
          {
            "version": "$TAG_VERSION",
            "notes": "CaberOS $TAG_VERSION",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "signature": "$SIGNATURE",
                "url": "https://github.com/$REPO/releases/download/${GITHUB_REF_NAME}/$TARGZ_NAME"
              }
            }
          }
          EOF
          echo "Generated latest.json:"
          cat latest.json

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: CaberOS-dmg
          path: frontend/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CaberOS-updater
          path: |
            frontend/src-tauri/target/release/bundle/**/*.tar.gz
            frontend/src-tauri/target/release/bundle/**/*.tar.gz.sig
            latest.json
          if-no-files-found: warn

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CaberOS ${{ github.ref_name }}
          body: |
            **Local-first AI Agent Operating System.**

            ### Download

            **macOS Apple Silicon (ARM64)** — download the `.dmg` file below.

            > macOS Intel and Windows builds are not yet available.

            ### Install

            1. Download the `.dmg` file
            2. Open it and drag **CaberOS** to your Applications folder
            3. Launch CaberOS — the gateway starts automatically
            4. Default login: `admin` / `admin` (change it immediately)

            ### Auto-update

            If you have a previous version of CaberOS installed, it will
            automatically detect this release and offer to update. You can
            also check manually from Settings → About → Check for Updates.

            ### System requirements

            - macOS 13+ (Apple Silicon)
            - 200 MB free disk space
            - Internet connection for cloud model providers (optional for local models via Ollama)

            ---
            **License:** MIT — Copyright (c) 2025 HoangPH25
          generate_release_notes: true
          files: |
            frontend/src-tauri/target/release/bundle/dmg/*.dmg
            frontend/src-tauri/target/release/bundle/**/*.tar.gz
            frontend/src-tauri/target/release/bundle/**/*.tar.gz.sig
            latest.json
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
