name: Release

# Builds the CaberOS desktop app (.dmg) and attaches it to a GitHub release.
# Triggers when a tag matching v*.*.* is pushed.
#
# Usage:
#   git tag v0.1.0
#   git push origin v0.1.0
#
# The workflow will:
#   1. Build the PyInstaller gateway (macOS ARM64)
#   2. Build the Tauri app (which bundles the gateway + React frontend)
#   3. Create a DMG
#   4. Create a GitHub release with the DMG attached
#
# Platform: macOS ARM64 (Apple Silicon) only for now.
# macOS Intel and Windows builds require separate runners (future work).

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build macOS ARM64
    runs-on: macos-14  # Apple Silicon runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Set up Python
        run: uv python install 3.12

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Build PyInstaller gateway
        run: bash scripts/build-gateway.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Tauri app
        working-directory: frontend
        run: npm run desktop:build

      - name: Build DMG
        run: bash scripts/build-dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: CaberOS-dmg
          path: frontend/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CaberOS ${{ github.ref_name }}
          generate_release_notes: true
          files: frontend/src-tauri/target/release/bundle/dmg/*.dmg
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
