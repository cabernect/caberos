name: Release

# Builds the CaberOS desktop app for every supported platform and attaches the
# installers plus signed updater artifacts to a GitHub release.
# Triggers when a tag matching v*.*.* is pushed.
#
# Usage:
#   git tag v0.3.0
#   git push origin v0.3.0
#
# Structure: a `build` matrix produces per-platform artifacts, then a single
# `release` job assembles the updater manifest from ALL of them.
#
# The manifest is deliberately NOT written inside a platform job. It lives at a
# fixed URL and holds every platform's entry, so a per-platform job writing it
# would overwrite the others — silently stopping updates for every platform
# that lost the race. scripts/build-updater-manifest.py enforces that the
# manifest covers every expected platform before a release is published.
#
# Required secrets:
#   TAURI_SIGNING_PRIVATE_KEY — Ed25519 private key for signing updates
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — password for the private key

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  # Every platform this release must contain. The manifest step fails if any is
  # missing, rather than publishing a manifest that strands those users.
  EXPECTED_PLATFORMS: darwin-aarch64,windows-x86_64

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # One platform failing must not discard the other's artifacts.
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-14
            platform_key: darwin-aarch64
            bundle_script: desktop:build
          - name: Windows x64
            runner: windows-2022
            platform_key: windows-x86_64
            bundle_script: desktop:build:windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify version manifests agree with tag
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/check-version.sh
          BACKEND_VERSION=$(grep '^version = ' backend/pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if [ "$BACKEND_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match manifest version ($BACKEND_VERSION)"
            echo "Run: ./scripts/set-version.sh $TAG_VERSION"
            exit 1
          fi
          echo "Tag and manifests agree: $TAG_VERSION"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Set up Python
        run: uv python install 3.12

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Cache PyInstaller build
        uses: actions/cache@v4
        with:
          path: |
            backend/build/pyinstaller
            frontend/src-tauri/resources/gateway
          key: pyinstaller-${{ runner.os }}-${{ hashFiles('backend/uv.lock', 'scripts/build-gateway.sh', 'scripts/build-gateway.ps1') }}
          restore-keys: |
            pyinstaller-${{ runner.os }}-

      - name: Build PyInstaller gateway
        run: node scripts/build-gateway.mjs

      # Catches a packaged gateway that builds but cannot start - the exact
      # class of failure that shipped in v0.1.6 (relative import under
      # PyInstaller) and that a build-only check cannot see.
      - name: Smoke test packaged gateway
        shell: bash
        run: |
          set -euo pipefail
          GATEWAY_DIR="$(pwd)/frontend/src-tauri/resources/gateway/caberos-gateway"
          if [ "${{ runner.os }}" = "Windows" ]; then
            GATEWAY="$GATEWAY_DIR/caberos-gateway.exe"
          else
            GATEWAY="$GATEWAY_DIR/caberos-gateway"
          fi
          CHECK_DIR="$(mktemp -d "${TMPDIR:-/tmp}/caberos-gateway-release.XXXXXX")"
          GATEWAY_PID=""
          cleanup() {
            if [ -n "$GATEWAY_PID" ]; then
              kill "$GATEWAY_PID" 2>/dev/null || true
              wait "$GATEWAY_PID" 2>/dev/null || true
            fi
            rm -rf "$CHECK_DIR"
          }
          trap cleanup EXIT
          cd "$CHECK_DIR"
          AGENTOS_CONTROL_PLANE_HOST=127.0.0.1           AGENTOS_CONTROL_PLANE_PORT=51999           AGENTOS_DB_PATH="$CHECK_DIR/agentos.db"           AGENTOS_SECRET_KEY_PATH="$CHECK_DIR/secret.key"           AGENTOS_WORKSPACE_ROOT="$CHECK_DIR/workspaces"           AGENTOS_KNOWLEDGE_ROOT="$CHECK_DIR/knowledge"           AGENTOS_AGENT_HOME_ROOT="$CHECK_DIR/agents"           AGENTOS_LOG_LEVEL=warning           AGENTOS_LOG_ACCESS=false           "$GATEWAY" >"$CHECK_DIR/gateway.log" 2>&1 &
          GATEWAY_PID=$!
          for _ in $(seq 1 120); do
            if curl --silent --fail --max-time 1 http://127.0.0.1:51999/health >/dev/null 2>&1; then
              echo "Packaged gateway health check passed"
              exit 0
            fi
            if ! kill -0 "$GATEWAY_PID" 2>/dev/null; then
              echo "Packaged gateway exited before becoming ready"
              cat "$CHECK_DIR/gateway.log"
              exit 1
            fi
            sleep 0.25
          done
          echo "Packaged gateway did not become ready"
          cat "$CHECK_DIR/gateway.log"
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontend/src-tauri/target
          key: rust-${{ runner.os }}-${{ hashFiles('frontend/src-tauri/Cargo.lock', 'frontend/src-tauri/src/**/*.rs', 'frontend/src-tauri/Cargo.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-

      # build-gateway.mjs dispatches to the .sh or .ps1 build. The two differ
      # because PyInstaller's --add-data separator is platform-specific.
      - name: Build Tauri app with updater artifacts
        working-directory: frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run ${{ matrix.bundle_script }}

      - name: Build DMG
        if: runner.os == 'macOS'
        run: bash scripts/build-dmg.sh

      # Collect the installer and the updater archive+signature under stable
      # names so the release job does not need to know platform layouts.
      - name: Stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          BUNDLE="frontend/src-tauri/target/release/bundle"
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp "$BUNDLE/macos/CaberOS.app.tar.gz" staging/
            cp "$BUNDLE/macos/CaberOS.app.tar.gz.sig" staging/
            cp "$BUNDLE"/dmg/*.dmg staging/
          else
            cp "$BUNDLE"/nsis/*-setup.nsis.zip staging/
            cp "$BUNDLE"/nsis/*-setup.nsis.zip.sig staging/
            cp "$BUNDLE"/nsis/*-setup.exe staging/
          fi
          ls -la staging

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: caberos-${{ matrix.platform_key }}
          path: staging/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f | sort

      # Fails when a platform in EXPECTED_PLATFORMS is absent, so a half-built
      # release can never quietly drop a platform from the updater.
      - name: Build updater manifest
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MAC_ARCHIVE=$(find artifacts -name 'CaberOS.app.tar.gz' | head -1)
          WIN_ARCHIVE=$(find artifacts -name '*-setup.nsis.zip' | head -1)

          ARGS=()
          [ -n "$MAC_ARCHIVE" ] && ARGS+=(--platform "darwin-aarch64=$MAC_ARCHIVE")
          [ -n "$WIN_ARCHIVE" ] && ARGS+=(--platform "windows-x86_64=$WIN_ARCHIVE")

          python3 scripts/build-updater-manifest.py \
            --version "$TAG_VERSION" \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${GITHUB_REF_NAME}" \
            --expect "${EXPECTED_PLATFORMS}" \
            --out latest.json \
            "${ARGS[@]}"

          cat latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CaberOS ${{ github.ref_name }}
          body: |
            **Local-first AI Agent Operating System.**

            ### Download

            - **macOS Apple Silicon (ARM64)** — the `.dmg` file below.
            - **Windows x64** — the `-setup.exe` file below.

            > macOS Intel, Windows on ARM, and Linux builds are not yet available.
            > See `docs/platform-support.md` for the full support matrix.

            ### Install — macOS

            1. Open the `.dmg` and drag **CaberOS** to Applications
            2. If macOS reports that CaberOS is damaged, verify the download came
               from this release, then run:
               `xattr -dr com.apple.quarantine /Applications/CaberOS.app`
            3. Launch CaberOS — the gateway starts automatically

            ### Install — Windows

            1. Run the `-setup.exe` installer (installs for the current user, no admin needed)
            2. Windows SmartScreen may warn on first run while the signature builds
               reputation — choose **More info → Run anyway**
            3. Launch CaberOS — the gateway starts automatically

            **Shell commands on Windows** require WSL2 with `bubblewrap` installed:
            `wsl --install` then `wsl -e sudo apt install bubblewrap`.
            Without it, every other capability still works and the Observability →
            Health tab explains what is missing.

            ### First login

            Default credentials: `admin` / `admin` — change them immediately.

            ---
            **License:** MIT — Copyright (c) 2025 HoangPH25
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*-setup.exe
            artifacts/**/*.tar.gz
            artifacts/**/*.tar.gz.sig
            artifacts/**/*.nsis.zip
            artifacts/**/*.nsis.zip.sig
            latest.json
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
