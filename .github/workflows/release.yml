name: Release

# Builds the CaberOS desktop app (.dmg) and attaches it to a GitHub release.
# Triggers when a tag matching v*.*.* is pushed.
#
# Usage:
#   git tag v0.1.0
#   git push origin v0.1.0
#
# The workflow will:
#   1. Build the PyInstaller gateway (macOS ARM64)
#   2. Build the Tauri app (which bundles the gateway + React frontend)
#   3. Create a DMG
#   4. Create a GitHub release with the DMG attached
#
# Platform: macOS ARM64 (Apple Silicon) only for now.
# macOS Intel and Windows builds require separate runners (future work).

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build macOS ARM64
    runs-on: macos-14  # Apple Silicon runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Set up Python
        run: uv python install 3.12

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Build PyInstaller gateway
        run: bash scripts/build-gateway.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Tauri app
        working-directory: frontend
        run: npm run desktop:build

      - name: Build DMG
        run: bash scripts/build-dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: CaberOS-dmg
          path: frontend/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Build release notes
        id: notes
        run: |
          # If CHANGELOG.md exists and has a section for this version, use it.
          # Otherwise fall back to the default template.
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -f CHANGELOG.md ] && grep -q "## \[${VERSION}\]" CHANGELOG.md; then
            # Extract the section for this version
            awk "/## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > /tmp/changelog_section.md
            cat > /tmp/release_notes.md << 'HEADER'
          HEADER
            cat /tmp/changelog_section.md >> /tmp/release_notes.md
            cat >> /tmp/release_notes.md << 'FOOTER'

          ---

          ### Download

          **macOS Apple Silicon (ARM64)** — download the `.dmg` file below.

          > macOS Intel and Windows builds are not yet available.

          ### Install

          1. Download the `.dmg` file
          2. Open it and drag **CaberOS** to your Applications folder
          3. Launch CaberOS — the gateway starts automatically
          4. Default login: `admin` / `admin` (change it immediately)

          ### System requirements

          - macOS 13+ (Apple Silicon)
          - 200 MB free disk space
          - Internet connection for cloud model providers (optional for local models via Ollama)

          ---
          **License:** MIT — Copyright (c) 2025 HoangPH25
          FOOTER
          else
            cat > /tmp/release_notes.md << 'EOF'
          ## CaberOS ${GITHUB_REF_NAME}

          Local-first AI Agent Operating System.

          ### Download

          **macOS Apple Silicon (ARM64)** — download the `.dmg` file below.

          > macOS Intel and Windows builds are not yet available.

          ### Install

          1. Download the `.dmg` file
          2. Open it and drag **CaberOS** to your Applications folder
          3. Launch CaberOS — the gateway starts automatically
          4. Default login: `admin` / `admin` (change it immediately)

          ### What's new

          See the [commit history](https://github.com/cabernect/caberos/commits/${GITHUB_REF_NAME}) for changes in this release.

          ### System requirements

          - macOS 13+ (Apple Silicon)
          - 200 MB free disk space
          - Internet connection for cloud model providers (optional for local models via Ollama)

          ---
          **License:** MIT — Copyright (c) 2025 HoangPH25
          EOF
          fi
          echo "path=/tmp/release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CaberOS ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: frontend/src-tauri/target/release/bundle/dmg/*.dmg
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
