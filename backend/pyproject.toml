[project]
name = "agentos"
version = "0.1.0"
description = "CaberOS — local-first AI Agent Operating System"
readme = "README.md"
authors = [
    { name = "HoangPH25", email = "hoangph25@fpt.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.5",
    "bcrypt>=5.0.0",
    "beautifulsoup4>=4.15.0",
    "cryptography>=50.0.0",
    "fastapi>=0.140.13",
    "httpx>=0.28.1",
    "httpx2>=2.11.0",
    "litellm>=1.94.0",
    "mcp>=2.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[project.optional-dependencies]
# Install with: uv pip install -e ".[postgres]"  (or uv sync --extra postgres)
postgres = [
    "asyncpg>=0.30.0",
]

[build-system]
requires = ["uv_build>=0.9.6,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures contain long HTML/JSON strings that are clearer unsplit
"tests/*" = ["E501"]
# Source files with long string literals (prompts, SQL, URLs, docstrings)
"src/agentos/runner.py" = ["E501"]
"src/agentos/harness/compaction.py" = ["E501"]
"src/agentos/harness/loop.py" = ["E501"]
"src/agentos/harness/context.py" = ["E501"]
"src/agentos/capabilities/builtin.py" = ["E501"]
"src/agentos/capabilities/tools/file.py" = ["E501"]
"src/agentos/capabilities/tools/subagent.py" = ["E501"]
"src/agentos/channels/telegram.py" = ["E501"]
"src/agentos/channels/registry.py" = ["E501"]
"src/agentos/db_backends/sqlite_backend.py" = ["E501"]
"src/agentos/db_backends/postgres_backend.py" = ["E501"]
"src/agentos/memory/episodic.py" = ["E501"]
"src/agentos/api/skills.py" = ["E501"]
"src/agentos/api/mcp.py" = ["E501"]
"src/agentos/auth.py" = ["E501"]
"src/agentos/main.py" = ["E501"]
"src/agentos/mcp/client.py" = ["E501"]
"src/agentos/models/channel_config.py" = ["E501"]
"src/agentos/models/mcp.py" = ["E501"]
"src/agentos/skills/loader.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.agentos]
# src layout: the package is at src/agentos

